name: buddy_kottu
description: "Buddy Kottu - Hyperlocal commerce app for Sri Siva General Stores (Everything Nearby)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  
  # Network & Utilities
  dio: ^5.4.0
  intl: ^0.19.0
  uuid: ^4.3.3
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.0.0
  
  # Visual & UI
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  badges: ^3.1.2
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
